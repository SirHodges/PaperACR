<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ACR Form Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f1; --panel:#ffffff; --ink:#13201d; --muted:#5d6f6a;
    --line:#dde5e2; --field:#f3f6f5; --accent:#0f766e; --accent-ink:#0b5a54;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* top bar */
  .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .tabs{display:flex;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:4px;justify-self:center;flex-wrap:wrap;justify-content:center}
  .bar>div:empty{display:none}
  @media (max-width:600px){
    .bar{grid-template-columns:1fr;justify-items:center;row-gap:8px}
    .lookup-link{justify-self:center}
  }
  .tab{border:0;background:transparent;color:var(--muted);font:700 14px 'Inter';padding:8px 18px;
    border-radius:8px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .spacer{flex:1}
  .lookup-link{justify-self:start;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--accent-ink);
    font:700 14px 'Inter';border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:var(--panel);white-space:nowrap}
  .lookup-link:hover{border-color:var(--accent)}

  /* hint + zoom controls */
  .subbar{display:flex;align-items:center;gap:10px;padding:8px 14px;flex:0 0 auto}
  .hint{font-size:13px;color:var(--muted);flex:1;min-width:0}
  .zoomctl{display:flex;gap:6px}
  .zoomctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;font-size:20px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .zoomctl button:hover{border-color:var(--accent);color:var(--accent-ink)}
  .zoomctl .reset{width:auto;padding:0 14px;font:600 13px 'Inter'}

  /* stage */
  .stage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;background:#dfe6e3;
    -webkit-user-select:none;user-select:none}
  .canvas{position:absolute;top:0;left:0;width:100%;transform-origin:0 0;will-change:transform}
  .canvas img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
  .zone{position:absolute;border:2px solid rgba(15,118,110,.55);background:rgba(15,118,110,.10);
    border-radius:5px;cursor:pointer;padding:3px;overflow:hidden;display:flex;align-items:flex-start}
  .zone:hover,.zone:focus{background:rgba(15,118,110,.24);border-color:var(--accent);outline:none}
  .zlabel{font:700 11px 'Inter';color:#08443e;background:rgba(255,255,255,.86);
    padding:1px 6px;border-radius:5px;pointer-events:none;line-height:1.25;max-width:100%}

  /* popup: bottom sheet on phone, dialog on desktop */
  .overlay{position:fixed;inset:0;background:rgba(15,25,23,.5);display:flex;z-index:50;
    align-items:flex-end;justify-content:center}
  .pop{background:var(--panel);width:100%;max-width:600px;max-height:82dvh;overflow:auto;
    border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .2s ease}
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .pop-head{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:12px;
    padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .pop-head h2{flex:1;font-family:'Archivo';font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
  .x{border:0;background:var(--field);width:36px;height:36px;border-radius:10px;cursor:pointer;
    font-size:20px;color:var(--muted)}
  .x:hover{background:#e6ece9;color:var(--ink)}
  .pop-body{padding:16px 20px 26px}
  .pop-body .lead{font-size:15.5px;margin:0 0 8px;color:var(--ink)}
  .pop-body h4{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent-ink);margin:18px 0 8px}
  .pop-body ul{margin:0;padding-left:20px}
  .pop-body li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .pop-body b{color:var(--ink)}
  .codecols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
  .codecol-h{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent-ink);font-weight:700;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .coderow{font-size:13px;line-height:1.5;padding:2px 0;color:var(--ink)}
  .coderow b{font-family:'JetBrains Mono',monospace;color:var(--accent);margin-right:5px;font-weight:700}
  @media (max-width:560px){.codecols{grid-template-columns:1fr;gap:18px}}

  @media (min-width:640px){
    .overlay{align-items:center}
    .pop{border-radius:18px;max-height:80dvh}
    @keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="bar">
    <a class="lookup-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l6-6M5 12l6 6"/></svg>
      Code lookup
    </a>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-page="front" aria-selected="true">Front</button>
      <button class="tab" role="tab" data-page="back" aria-selected="false">Back</button>
      <button class="tab" role="tab" data-page="refusal" aria-selected="false">Refusal (code 72)</button>
    </div>
    <div></div>
  </div>

  <div class="subbar">
    <div class="hint">Tap a highlighted section for an explanation. Pinch or scroll to zoom; drag to move.</div>
    <div class="zoomctl">
      <button id="zoomOut" aria-label="Zoom out">&minus;</button>
      <button class="reset" id="zoomReset">Fit</button>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="canvas" id="canvas">
      <img id="pageImg" alt="Ambulance Call Report">
      <div id="zoneLayer"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle">
      <div class="pop-head"><h2 id="popTitle"></h2><button class="x" id="popClose" aria-label="Close">&times;</button></div>
      <div class="pop-body" id="popBody"></div>
    </div>
  </div>

<script>
const ZONES = {"front": [{"id": "demographics", "title": "Demographics", "x": 2.5, "y": 7, "w": 95, "h": 14.5, "body": "<p class='lead'>Identifies the call and the patient — service and call details, patient identifiers, and the pick-up location.</p><h4>From the standards</h4><ul><li>All dates are recorded <b>year/month/day (YYYY/MM/DD)</b>.</li><li>If any field here <b>cannot be obtained</b>, document <b>CNO</b> (Could Not Obtain) in the field and explain why in Remarks.</li><li>A <b>separate Call Report</b> is completed for each patient.</li><li>Coded entries (such as the pick-up code) use the ministry's published ACR codes — use the <b>code lookup</b> for current values.</li></ul>"}, {"id": "clinical", "title": "Clinical Information", "x": 2.5, "y": 22, "w": 95, "h": 17.5, "body": "<p class='lead'>The clinical picture at the time of the event — date/time of occurrence, chief complaint, the incident history narrative, the DNR confirmation number, and the FREI flag.</p><h4>Chief Complaint</h4><ul><li>The Chief Complaint should reflect the patient's <b>expressed issue — in the patient's own words</b> whenever possible.</li><li>A mechanism of injury (like an MVC) or an entry such as &lsquo;Transfer&rsquo; is <b>not a complaint</b> and doesn't belong in this section.</li></ul><h4>From the standards</h4><ul><li>Dates and times use <b>YYYY/MM/DD</b> and the <b>24-hour clock</b>.</li><li>If something can't be obtained, enter <b>CNO</b> and explain in Remarks.</li></ul>"}, {"id": "trauma", "title": "Trauma Problem Site/Type", "x": 65, "y": 29, "w": 32.5, "h": 10.5, "z": 2, "body": "<p class='lead'>Up to three trauma entries, each coded by Location, Type and Mechanism.</p><h4>From the standards</h4><ul><li>These use the ministry's published <b>ACR codes</b>. ACR codes on the form align with those published by the Ministry of Health and may be updated from time to time.</li><li>Use the <b>code lookup</b> for the current Site/Type code values.</li></ul>"}, {"id": "history", "title": "Relevant Past History → Treatment Prior to Arrival", "x": 2.5, "y": 39.5, "w": 95, "h": 25, "body": "<p class='lead'>Four stacked blocks: Relevant Past History, Medications, Allergies, and Treatment Prior to Arrival.</p><h4>From the standards</h4><ul><li>If the information for any of these fields <b>cannot be obtained</b>, document <b>CNO</b> (Could Not Obtain) in the field and explain why in the <b>Remarks</b> section.</li></ul>"}, {"id": "cardiac", "title": "Cardiac Arrest Information", "x": 2.5, "y": 65, "w": 95, "h": 6.5, "body": "<p class='lead'>Completed for cardiac arrests: Arrest Witnessed By, CPR Started By, and First Shock By, plus date and start time.</p><h4>From the standards</h4><ul><li>Times use the <b>24-hour clock</b> and dates are <b>YYYY/MM/DD</b>.</li><li>Clinically relevant <b>biometric data</b> — which includes CPR metric data and captured rhythm strips — is transferred onto the Call Report or stored per local policy so it can be easily reviewed.</li></ul>"}, {"id": "exam", "title": "Physical Exam", "x": 2.5, "y": 71.5, "w": 95, "h": 25, "body": "<p class='lead'>Head-to-toe findings: general appearance, skin, head/neck, chest, abdomen, back/pelvis, and extremities.</p><h4>From the standards</h4><ul><li>Document all <b>assessments</b> as required by the BLS PCS and/or ALS PCS, each with a documented <b>time of initiation</b>, and indicate the <b>crew member</b> who performed it by number.</li><li>If a field can't be obtained, enter <b>CNO</b> and explain in Remarks.</li></ul>"}], "back": [{"id": "treatment", "title": "Clinical Treatment / Procedures", "x": 2.5, "y": 4.5, "w": 95, "h": 51.5, "body": "<p class='lead'>The time-sequenced record of clinical treatments and procedures, with their results and vitals.</p><h4>From the standards</h4><ul><li>Document all treatments and procedures (with a <b>corresponding result</b>) in <b>chronological order</b>; each has a documented <b>time of initiation</b> using the 24-hour clock.</li><li>When a <b>procedure code</b> is used, provide a brief narrative describing the procedure and the result.</li><li>Each entry indicates the <b>crew member</b> who performed it by number (1, 2, 3, 4…), and that number corresponds to the crew member's <b>signature</b>. For any <b>controlled act</b>, only the paramedic who actually performed it is entered.</li><li>Document any factors that led you to <b>delay or withhold</b> a treatment or procedure that a ministry standard would otherwise indicate.</li><li>On paper, procedure and results are written <b>through the columns and across the ghosted lines</b>; if you need more space, continue on the line below or use a second Call Report.</li></ul><h4>From the FAQ</h4><ul><li>If you run out of space, <b>start a second ACR</b>: strike through the front page of the second ACR with a single line and initial it, then record the <b>Call #</b> and <b>page numbers</b> accurately on both forms.</li></ul>"}, {"id": "remarks", "title": "Remarks", "x": 2.5, "y": 56, "w": 95, "h": 12, "body": "<p class='lead'>Free-text area for narrative and anything that needs explanation. The standards direct several things here.</p><h4>What belongs here</h4><ul><li>An explanation for any field marked <b>CNO</b> (Could Not Obtain).</li><li>The <b>circumstances</b> if a patient/SDM or witness refuses to sign the refusal section.</li><li>Concerns about an <b>at-risk patient</b> (for example, intimate partner violence, human trafficking, elder abuse, or a child in need of protection), which are also communicated at transfer of care.</li><li>Any <b>triage tag numbers</b> used for initial scene triage.</li><li>An explanation of any <b>considerable delay</b> in accessing the patient, time spent on scene, or en route.</li><li><b>Addendums</b> — corrections or additions made after the report is completed go here, clearly marked &lsquo;ADDENDUM&rsquo; and date/time-stamped; no existing field is altered.</li><li>If more than one ambulance resource from the same service attends, the <b>additional vehicles</b> present are noted here.</li></ul>"}, {"id": "disposition", "title": "Primary Problem & Disposition", "x": 2.5, "y": 68, "w": 95, "h": 7.3, "body": "<p class='lead'>The call's coded outcome and acuity, and any death/pronouncement details.</p><h4>From the FAQ</h4><ul><li>Choose the <b>Problem Code</b> that best represents the patient's primary issue. The codes are listed on the back of the ACR, and the complete list of ministry problem codes is available on ontario.ca.</li></ul><h4>From the standards</h4><ul><li>A separate <b>Return Priority Code</b> and <b>CTAS</b> is recorded for each patient assessed, treated and/or transported.</li><li>CTAS is based on the ministry's <b>Prehospital CTAS Paramedic Guide</b>.</li><li>Any pronouncement date/time uses <b>YYYY/MM/DD</b> and the 24-hour clock.</li></ul>"}, {"id": "genadmin", "title": "General Administration", "x": 2.5, "y": 75.5, "w": 95, "h": 21, "body": "<p class='lead'>Operational and dispatch data, the crew, and the copy distribution.</p><h4>Times</h4><ul><li><b>Dispatch time stamps</b> include hours/minutes/seconds (<b>HH:MM:SS</b>); dates are <b>YYYY/MM/DD</b>.</li></ul><h4>Crew &amp; signatures</h4><ul><li>All paramedics present attach their <b>name, ministry ID number and signature</b>. The attending paramedic's signature affirms the report's content, accuracy and completeness and acknowledges the procedures they performed; assisting paramedics affirm they were present and acknowledge procedures they performed.</li><li>The <b>crew member numbers</b> in the treatment record correspond to these signatures.</li><li><b>Students</b> present on a call are listed and sign, are listed for any intervention they did, and otherwise don't complete patient care documentation.</li></ul><h4>Patients &amp; destination</h4><ul><li><b>Patient(s)</b> shows the total number of patients assessed by the crew, and <b>Sequence</b> identifies which patient this report refers to; patients not transported are still included in the sequencing. If no one was contacted, enter <b>0</b> for both.</li><li><b>Receiving Facility/Destination</b> records where the patient was transferred and to whom care was transferred; advise the Communications Centre of the <b>Transfer of Care</b> time and document it on the report.</li></ul><h4>From the FAQ</h4><ul><li>The <b>Call #</b> must be recorded on <b>both pages</b> of the ACR.</li></ul><h4>Distribution</h4><ul><li>The receiving facility/department (or the coroner, for termination of resuscitation or obvious death); the receiving hospital <b>billing office</b> (billing information only, no clinical detail); the <b>Base Hospital</b>; and the <b>ambulance service</b> (its copy includes all biometric data).</li></ul>"}], "refusal": [{"id": "refusal", "title": "Refusal of Service (code 72)", "x": 1.5, "y": 1.5, "w": 97, "h": 97, "body": "<p class='lead'>Documents a patient (or substitute decision-maker) declining transport and/or treatment, with the capacity assessment and signatures that support it. The matching no-transport code is <b>72 – Patient Refused</b> (an ACR code — use the code lookup).</p><h4>Capacity</h4><ul><li>This applies when a patient <b>with capacity</b> is refusing transport. Capacity / capability to refuse consent is assessed as detailed in the <b>BLS PCS and ALS PCS</b>.</li></ul><h4>Signatures</h4><ul><li>Ask the <b>patient/SDM</b> and any <b>witness</b> to sign the refusal section. A witness here is a person who witnessed the refusal of care/transport.</li><li>The patient or SDM is <b>not obligated to sign</b>, and may be unable or unwilling to.</li><li>If the patient/SDM or witness refuses to sign, document the <b>circumstances in Remarks</b>.</li><li>If only one paramedic is attending, make every effort to have a <b>witness</b> sign.</li></ul><h4>Consent not given</h4><ul><li>If consent to a required assessment or treatment is not given or is withdrawn at any time, document this in the <b>procedure const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const stage=document.getElementById('stage'), canvas=document.getElementById('canvas'),
      pageImg=document.getElementById('pageImg'), zoneLayer=document.getElementById('zoneLayer');
let page='front', scale=1, tx=0, ty=0, fitS=1, IMGW=868, IMGH=1400;
const MAXMULT=6;

function loadPage(p){
  page=p;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.page===p));
  pageImg.src=IMG[p];
  zoneLayer.innerHTML=ZONES[p].map(z=>
    `<button class="zone" data-zone="${z.id}" style="left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;${z.z?'z-index:'+z.z:''}">
       <span class="zlabel">${esc(z.title)}</span></button>`).join('');
  canvas.style.width=IMGW+'px';
  fit();
}
function setImgSize(){
  IMGW=pageImg.naturalWidth||IMGW; IMGH=pageImg.naturalHeight||IMGH;
  canvas.style.width=IMGW+'px';
}
function computeFit(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  fitS=Math.min(sw/IMGW, sh/IMGH);
  if(!isFinite(fitS)||fitS<=0) fitS=1;
}
function apply(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function constrain(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const cw=IMGW*scale, ch=IMGH*scale;
  tx = cw<=sw ? (sw-cw)/2 : Math.min(0, Math.max(sw-cw, tx));
  ty = ch<=sh ? (sh-ch)/2 : Math.min(0, Math.max(sh-ch, ty));
}
function fit(){computeFit(); scale=fitS; constrain(); apply();}
function zoomAt(factor,px,py){
  const ns=Math.min(fitS*MAXMULT, Math.max(fitS, scale*factor)); const f=ns/scale;
  tx = px-(px-tx)*f; ty = py-(py-ty)*f; scale=ns; constrain(); apply();
}

// gestures
const pts=new Map(); let lastDist=0, moved=false, multi=false, downX=0, downY=0;
function rel(e){const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  const p=rel(e);
  if(pts.size===0){moved=false;multi=false;downX=p.x;downY=p.y;}
  pts.set(e.pointerId, p);
  if(pts.size===2){multi=true;lastDist=0;}
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=rel(e), prev=pts.get(e.pointerId);
  if(pts.size===1){
    tx+=p.x-prev.x; ty+=p.y-prev.y; constrain(); apply();
    if(Math.hypot(p.x-downX,p.y-downY)>8) moved=true;
  }
  pts.set(e.pointerId,p);
  if(pts.size===2){
    const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(lastDist) zoomAt(d/lastDist, mid.x, mid.y);
    lastDist=d; moved=true;
  }
});
function endPt(e){
  const tap = pts.size===1 && !moved && !multi;
  pts.delete(e.pointerId);
  if(pts.size<2) lastDist=0;
  if(pts.size===0 && tap){
    const el=document.elementFromPoint(e.clientX, e.clientY);
    const z=el && el.closest ? el.closest('.zone') : null;
    if(z) openSection(z.dataset.zone);
  }
}
stage.addEventListener('pointerup',endPt);
stage.addEventListener('pointercancel',e=>{pts.delete(e.pointerId); if(pts.size<2)lastDist=0;});
stage.addEventListener('wheel',e=>{e.preventDefault(); const p=rel(e); zoomAt(e.deltaY<0?1.15:1/1.15,p.x,p.y);},{passive:false});

// keyboard activation (Enter/Space on a focused zone)
stage.addEventListener('click',e=>{const z=e.target.closest('.zone'); if(z && e.detail===0) openSection(z.dataset.zone);});

document.getElementById('zoomIn').onclick=()=>zoomAt(1.4,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById('zoomOut').onclick=()=>zoomAt(1/1.4,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById('zoomReset').onclick=fit;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>loadPage(t.dataset.page));
window.addEventListener('resize',()=>{
  const wasFit=Math.abs(scale-fitS)<0.001; computeFit();
  scale = wasFit ? fitS : Math.max(fitS, scale); constrain(); apply();
});

// popup
const overlay=document.getElementById('overlay'), popTitle=document.getElementById('popTitle'),
      popBody=document.getElementById('popBody');
let popOpenedAt=0;
function openSection(id){
  const z=ZONES[page].find(s=>s.id===id); if(!z)return;
  popTitle.textContent=z.title; popBody.innerHTML=z.body; overlay.hidden=false;
  popOpenedAt=Date.now();
  document.getElementById('popClose').focus();
}
function closePop(){overlay.hidden=true;}
document.getElementById('popClose').onclick=closePop;
overlay.addEventListener('click',e=>{if(Date.now()-popOpenedAt<400)return; if(e.target===overlay)closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});

pageImg.addEventListener('load',()=>{setImgSize(); fit();});
loadPage('front');
</script>
</body>
</html>
